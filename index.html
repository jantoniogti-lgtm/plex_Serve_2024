<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLEXMAX V8 ULTIMATE</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
.hero{height:28vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=2400&auto=format&fit=crop') center/cover}
.logo{font-size:70px;font-weight:900;color:#ffb000;text-shadow:0 0 40px #ffb000}
.wrap{max-width:1400px;margin:auto;padding:20px}
.card{background:rgba(0,0,0,.75);border:1px solid #ffb000;border-radius:20px;padding:20px;margin:15px 0}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px}
button{background:#ffb000;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:#111;padding:15px;border-radius:15px;text-align:center}
.num{font-size:32px;color:#ffb000;font-weight:900}
.admin{display:none}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #333;padding:8px}
</style>

<style>
.topbar{position:fixed;top:0;left:0;right:0;background:rgba(0,0,0,.85);backdrop-filter:blur(10px);padding:12px 20px;z-index:999}
.topbar h3{margin:0;color:#ffb000}
.hero video{position:absolute}
.carousel{display:flex;gap:12px;overflow-x:auto;padding:15px 0}
.movie{min-width:220px;height:320px;border-radius:16px;background:linear-gradient(135deg,#222,#111);display:flex;align-items:end;padding:15px;font-weight:bold;border:1px solid #ffb000}
</style>

<style>
@media (max-width:768px){
.logo{font-size:60px!important}
.hero{height:55vh!important;padding:20px}
.hero h1{font-size:26px}
.hero p{font-size:14px}
.wrap{padding:10px!important}
.grid{grid-template-columns:1fr 1fr!important}
.card{padding:12px!important;margin:8px 0!important}
table{display:block;overflow-x:auto;white-space:nowrap;font-size:12px}
button,input,select,textarea{font-size:16px!important}
.topbar h3{font-size:16px}
}
</style>

<style>
@media (max-width:768px){
  .topbar{padding:10px!important}
  .logo{font-size:48px!important}
  .hero{height:40vh!important;min-height:300px!important}
  .hero h1{font-size:22px!important;margin:5px 0}
  .hero p{font-size:13px!important}
  .grid{grid-template-columns:1fr!important}
  .stat{padding:10px!important}
  .num{font-size:24px!important}
  .card{border-radius:14px!important}
  table,thead,tbody,tr,td,th{font-size:11px!important}
}
</style>
</head>
<body>

<div class="hero">
<div class="logo">PLEXMAX</div>


</div>


<div class="wrap" style="margin-top:-10px">


</div>

<div class="card">
<h2>Nueva Solicitud</h2>
<input id="nombre" placeholder="Nombre">
<select id="categoria"><option>PELICULA</option><option>SERIE</option><option>DOCUMENTAL</option></select>
<textarea id="contenido" placeholder="Contenido solicitado"></textarea>
<button onclick="enviar()">Enviar solicitud</button>
</div>

<div class="card">
<button onclick="login()">🔒 Abrir Panel Admin</button>
</div>

<div id="admin" class="admin">
<div class="grid">
<div class="stat"><div class="num" id="series">0</div>Series</div>
<div class="stat"><div class="num" id="t2">0</div>Pendientes</div>
<div class="stat"><div class="num" id="pelis">0</div>Películas</div>
<div class="stat"><div class="num" id="t4">0</div>Completadas</div>
</div>

<div class="card">
<button onclick="cargarSolicitudes()">🔄 Actualizar</button>
<button onclick="filtroTipo('TODAS')">Todas</button>
<button onclick="filtroTipo('PELICULA')">Películas</button>
<button onclick="filtroTipo('SERIE')">Series</button>
<button onclick="filtroTipo('DOCUMENTAL')">Documentales</button>
</div>

<div class="card">
<table>
<thead><tr><th>Fecha</th><th>Solicitud</th><th>Solicitante</th><th>Tipo</th><th>Estado</th><th></th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>
</div>

<script>
const PASS='2990';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSpkjq9f2qd79pEJVPFaSsoTegUndkPCPCOV2KdA88kh1lkc5k5fTtOqgxTZivIQ_0yxZyRxbIZJHl-/pub?gid=740415843&single=true&output=csv';

async function enviar(){

 if(!nombre.value || !contenido.value){
   alert('Completa todos los campos');
   return;
 }

 const fd = new FormData();

 fd.append('entry.85519895', contenido.value);
 fd.append('entry.1498068154', categoria.value.toUpperCase());
 fd.append('entry.160243918', nombre.value);

 await fetch('https://docs.google.com/forms/d/e/1FAIpQLSexqG8wynWrNlUAhBH4UBH7MOmjUKk5XYc5e8Dyhf0EzVH0yQ/formResponse',{
   method:'POST',
   mode:'no-cors',
   body:fd
 });

 nombre.value='';
 contenido.value='';

 alert('✅ Solicitud enviada correctamente');
}

function login(){
 const p=prompt('Contraseña');
 if(p===PASS){
   admin.style.display='block';
   cargarSolicitudes();
 }
}



function eliminarSolicitud(id){
 localStorage.setItem('eliminada_'+id,'SI');
 cargarSolicitudes();
}

let filtroActual='TODAS';

function filtroTipo(tipo){
 filtroActual=tipo;
 cargarSolicitudes();
}

function completar(id){
 localStorage.setItem('crm_'+id,'COMPLETADA');
 cargarSolicitudes();
}

function reabrir(id){
 localStorage.removeItem('crm_'+id);
 cargarSolicitudes();
}

async function cargarSolicitudes(){
 const res=await fetch(CSV_URL);
 const csv=await res.text();
 const filas=csv.trim().split('\n').slice(1);
 let h='';
 let peliculas=0; let seriesCount=0; let documentales=0;
filas.reverse().forEach((f,i)=>{
   const c=f.split(',');
   const fecha=c[0]||'';
   const solicitud=c[1]||'';
   const nombre=c[2]||'';
   const tipo=(c[3]||'').trim().toUpperCase();

   if(tipo==='PELICULA') peliculas++;
if(tipo==='SERIE') seriesCount++;
if(tipo==='DOCUMENTAL') documentales++;
if(localStorage.getItem('eliminada_'+i)==='SI') return;

   if(filtroActual!=='TODAS' && tipo!==filtroActual) return;

   const estado=localStorage.getItem('crm_'+i)?'COMPLETADA':'PENDIENTE';

   h += `<tr>
   <td>${fecha}</td>
   <td>${solicitud}</td>
   <td>${nombre}</td>
   <td>${tipo||'-'}</td>
   <td>${estado}</td>
   <td>${estado==='PENDIENTE'
      ? `<button onclick="completar(${i})">✅</button>`
      : `<button onclick="reabrir(${i})">↩️</button>`}
   </td>
   <td><button onclick="eliminarSolicitud(${i})">🗑️</button></td>
   </tr>`;
 });
 pelis.textContent=peliculas; if(document.getElementById('series')) series.textContent=seriesCount;
 tb.innerHTML=h;
 t1.textContent=filas.length;
 t2.textContent=filas.length;
 
 t4.textContent=Object.keys(localStorage).filter(k=>k.startsWith('crm_')).length;
}
</script>

</body>
</html>
