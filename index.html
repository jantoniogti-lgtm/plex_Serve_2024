<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PLEXMAX V8 ULTIMATE</title>
<style>
body{margin:0;font-family:Arial;background:#000;color:#fff}
.hero{height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;
background:linear-gradient(rgba(0,0,0,.4),rgba(0,0,0,.85)),
url('https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?q=80&w=2400&auto=format&fit=crop') center/cover}
.logo{font-size:120px;font-weight:900;color:#ffb000;text-shadow:0 0 40px #ffb000}
.wrap{max-width:1400px;margin:auto;padding:20px}
.card{background:rgba(0,0,0,.75);border:1px solid #ffb000;border-radius:20px;padding:20px;margin:15px 0}
input,textarea,select,button{width:100%;padding:12px;margin:6px 0;border:none;border-radius:10px}
button{background:#ffb000;font-weight:bold}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.stat{background:#111;padding:15px;border-radius:15px;text-align:center}
.num{font-size:32px;color:#ffb000;font-weight:900}
.admin{display:none}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #333;padding:8px}
</style>
</head>
<body>

<div class="hero">
<div class="logo">PLEXMAX</div>
<h1>ULTIMATE STREAMING PLATFORM</h1>
<p>Solicita películas y series de forma profesional</p>
</div>

<div class="wrap">
<div class="card">
<h2>Nueva Solicitud</h2>
<input id="nombre" placeholder="Nombre">
<select id="categoria"><option>Película</option><option>Serie</option></select>
<textarea id="contenido" placeholder="Contenido solicitado"></textarea>
<button onclick="enviar()">Enviar solicitud</button>
</div>

<div class="card">
<button onclick="login()">🔒 Abrir Panel Admin</button>
</div>

<div id="admin" class="admin">
<div class="grid">
<div class="stat"><div class="num" id="t1">0</div>Total</div>
<div class="stat"><div class="num" id="t2">0</div>Pendientes</div>
<div class="stat"><div class="num" id="t3">0</div>Proceso</div>
<div class="stat"><div class="num" id="t4">0</div>Completadas</div>
</div>

<div class="card">
<button onclick="cargarSolicitudes()">🔄 Actualizar</button>
</div>

<div class="card">
<table>
<thead><tr><th>Fecha</th><th>Nombre</th><th>Solicitud</th></tr></thead>
<tbody id="tb"></tbody>
</table>
</div>
</div>
</div>

<script>
const PASS='2990';
const CSV_URL='https://docs.google.com/spreadsheets/d/e/2PACX-1vSpkjq9f2qd79pEJVPFaSsoTegUndkPCPCOV2KdA88kh1lkc5k5fTtOqgxTZivIQ_0yxZyRxbIZJHl-/pub?gid=740415843&single=true&output=csv';

async function enviar(){
 const fd=new FormData();
 fd.append('entry.160243918',nombre.value);
 fd.append('entry.85519895',contenido.value);
 await fetch('https://docs.google.com/forms/d/e/1FAIpQLSexqG8wynWrNlUAhBH4UBH7MOmjUKk5XYc5e8Dyhf0EzVH0yQ/formResponse',{method:'POST',mode:'no-cors',body:fd});
 alert('Solicitud enviada');
}

function login(){
 const p=prompt('Contraseña');
 if(p===PASS){
   admin.style.display='block';
   cargarSolicitudes();
 }
}

async function cargarSolicitudes(){
 const res=await fetch(CSV_URL);
 const csv=await res.text();
 const filas=csv.trim().split('\n').slice(1);
 let h='';
 filas.reverse().forEach(f=>{
   const c=f.split(',');
   h += `<tr><td>${c[0]||''}</td><td>${c[1]||''}</td><td>${c[2]||''}</td></tr>`;
 });
 tb.innerHTML=h;
 t1.textContent=filas.length;
 t2.textContent=filas.length;
 t3.textContent=0;
 t4.textContent=0;
}
</script>

</body>
</html>
