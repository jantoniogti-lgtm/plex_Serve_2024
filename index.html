<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PLEXMAX - Solicitar Contenido</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Montserrat',sans-serif}
body{background:#050505;color:#fff;min-height:100vh;padding:20px}
.request-box{max-width:1100px;margin:0 auto;background:#101010;border-radius:36px;padding:50px;border:1px solid rgba(255,176,0,.2)}
.premium-header{text-align:center;margin-bottom:40px}
.premium-icon{width:110px;height:110px;margin:auto;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#ffb000;font-size:50px;margin-bottom:25px}
.premium-header h2{font-size:72px;font-weight:900;line-height:0.95}
.premium-header h2 span{display:block;color:#ffb000}
.premium-header p{margin-top:20px;color:#ccc;font-size:18px}
label{display:block;color:#ffb000;font-weight:800;margin:20px 0 10px}
input,textarea{width:100%;padding:20px;background:#060606;border:1px solid rgba(255,255,255,.08);color:white;border-radius:18px}
textarea{height:180px;resize:none}
button{width:100%;padding:22px;background:#ffb000;border:none;border-radius:18px;font-size:20px;font-weight:900;cursor:pointer;margin-top:25px}
#ok{display:none;text-align:center;margin-top:20px;color:#8fff8f;font-weight:700}
</style>
</head>
<body>
<div class="request-box">
<div class="premium-header">
<div class="premium-icon">🎬</div>
<h2>SOLICITAR <span>CONTENIDO</span></h2>
<p>Pide películas, series o documentales y nuestro equipo las añadirá a PLEXMAX.</p>
</div>

<form id="f">
<label>Tu nombre</label>
<input id="nombre" placeholder="Escribe tu nombre" required>

<label>Contenido solicitado</label>
<textarea id="contenido" placeholder="Ejemplo: The Last of Us Temporada 2, Avatar 3..." required></textarea>

<button type="submit">ENVIAR SOLICITUD</button>
<div id="ok">✅ Solicitud enviada correctamente</div>
</form>
</div>

<script>
document.getElementById('f').addEventListener('submit', async function(e){
e.preventDefault();
const fd=new FormData();
fd.append('entry.160243918',document.getElementById('nombre').value);
fd.append('entry.85519895',document.getElementById('contenido').value);
await fetch('https://docs.google.com/forms/d/e/1FAIpQLSexqG8wynWrNlUAhBH4UBH7MOmjUKk5XYc5e8Dyhf0EzVH0yQ/formResponse',{method:'POST',mode:'no-cors',body:fd});
document.getElementById('ok').style.display='block';
this.reset();
});
</script>
</body></html>
